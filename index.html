    <!-- Revelar no scroll: marca data-visto quando o elemento aparece (ver src/index.css) -->
    <script>
      (function () {
        var d = document.documentElement
        if (!('IntersectionObserver' in window)) return
        d.classList.add('js')
        var io = new IntersectionObserver(function (itens) {
          itens.forEach(function (i) {
            if (i.isIntersecting) { i.target.setAttribute('data-visto', ''); io.unobserve(i.target) }
          })
        }, { rootMargin: '0px 0px -8% 0px' })
        var agendado = false
        function procurar() {
          agendado = false
          document.querySelectorAll('[data-revelar]:not([data-visto])').forEach(function (el) { io.observe(el) })
        }
        new MutationObserver(function () {
          if (!agendado) { agendado = true; requestAnimationFrame(procurar) }
        }).observe(d, { childList: true, subtree: true })
      })()
    </script>
